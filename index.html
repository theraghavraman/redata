function betacf(a,b,x){const MAX=100,EPS=3e-9,FPMIN=1e-30;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAX;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break}return h}

function welch(a,b){a=a.filter(Number.isFinite);b=b.filter(Number.isFinite);if(a.length<2||b.length<2)throw Error("Each group needs at least two valid numeric observations.");const ma=mean(a),mb=mean(b),va=sd(a)**2,vb=sd(b)**2,se2=va/a.length+vb/b.length;if(se2===0)throw Error("Both groups have zero estimated variance; the t-statistic is undefined.");const t=(ma-mb)/Math.sqrt(se2),df=se2**2/((va/a.length)**2/(a.length-1)+(vb/b.length)**2/(b.length-1)),p=betaI(df/(df+t*t),df/2,.5);return {n1:a.length,n2:b.length,mean1:ma,mean2:mb,diff:ma-mb,t,df,p}}

function regressionResult(x,y){const pts=data.filter(r=>isNum(r[x])&&isNum(r[y])).map(r=>({x:Number(r[x]),y:Number(r[y])})),n=pts.length;if(n<3)return '<div class="notice">Need at least three complete paired observations.</div>';const mx=mean(pts.map(p=>p.x)),my=mean(pts.map(p=>p.y)),ssx=sum(pts.map(p=>(p.x-mx)**2)),ssy=sum(pts.map(p=>(p.y-my)**2)),cross=sum(pts.map(p=>(p.x-mx)*(p.y-my)));if(!ssx||!ssy)return '<div class="notice">Correlation is undefined for a constant variable.</div>';const slope=cross/ssx,intercept=my-slope*mx,r=cross/Math.sqrt(ssx*ssy),r2=r*r;return '<div class="grid metric-grid">'+kpi("PEARSON r",r.toFixed(4),"linear association","r","#e0eafa")+kpi("R²",r2.toFixed(4),"variance explained in sample","R²","#dff1e4")+kpi("SLOPE",fmt(slope),"change in Y per one X","↗","#ffe7d3")+'</div><div class="result-box"><strong>OLS model</strong><p style="font:13px DM Mono,monospace;overflow-wrap:anywhere;margin:12px 0">ŷ = '+fmt(intercept)+' + ('+fmt(slope)+') × '+esc(x)+'</p><div class="mini-stat"><span>Complete pairs</span><b>'+n+'</b></div><div class="mini-stat"><span>Intercept</span><b>'+fmt(intercept)+'</b></div><div class="mini-stat"><span>Correlation direction</span><b>'+(r>0?"Positive":r<0?"Negative":"None")+'</b></div></div>'}

function formulaEval(expression,row){const refs=[];let src=expression.replace(/\[([^\]]+)\]/g,(m,name)=>{const i=cols().indexOf(name.trim());if(i<0)throw Error("Unknown column reference: "+name);refs.push(i);return "@"+i});const toks=[];const re=/\s*(?:(\d+(?:\.\d*)?|\.\d+)(?:([eE][+-]?\d+))?|(@\d+)|([()+\-*/%]))/gy;let pos=0;while(pos<src.length){re.lastIndex=pos;const m=re.exec(src);if(!m)throw Error("Invalid formula near: "+src.slice(pos,pos+12));pos=re.lastIndex;if(m[1]!==undefined)toks.push({t:"num",v:Number(m[1]+(m[2]||""))});else if(m[3])toks.push({t:"ref",v:Number(m[3].slice(1))});else toks.push({t:m[4]})}let i=0;function atom(){const t=toks[i++];if(!t)throw Error("Unexpected end of formula.");if(t.t==="num")return t.v;if(t.t==="ref"){const v=row[cols()[t.v]];if(!isNum(v))return null;return Number(v)}if(t.t==="-"||t.t==="+"){const n=atom();return n===null?null:t.t==="-"?-n:n}if(t.t==="("){const v=expr();if(!toks[i]||toks[i++].t!==")")throw Error("Missing closing parenthesis.");return v}throw Error("Expected a number, column reference or parenthesis.")}function term(){let v=atom();while(toks[i]&&["*","/","%"].includes(toks[i].t)){const op=toks[i++].t,n=atom();if(v===null||n===null)return null;if((op==="/"||op==="%")&&n===0)return null;v=op==="*"?v*n:op==="/"?v/n:v%n}return v}function expr(){let v=term();while(toks[i]&&["+","-"].includes(toks[i].t)){const op=toks[i++].t,n=term();if(v===null||n===null)return null;v=op==="+"?v+n:v-n}return v}const value=expr();if(i!==toks.length)throw Error("Unexpected token in formula.");return Number.isFinite(value)?value:null}
async function runSQL(){const btn=$("#runSqlBtn"),msg=$("#sqlMessage"),host=$("#sqlHost"),query=$("#sqlEditor").value.trim();btn.disabled=true;msg.innerHTML='<div class="result-message ok">Preparing in-memory SQLite database…</div>';try{if(!window.initSqlJs)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js");const SQL=await window.initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/"+f});if(sqlDb)sqlDb.close();sqlDb=new SQL.Database();const names=cols(),ident=c=>'"'+c.replace(/"/g,'""')+'"',type=c=>numCols().includes(c)?"REAL":"TEXT",schema=names.map(c=>ident(c)+" "+type(c)).join(",");sqlDb.run("CREATE TABLE data ("+schema+")");const ins=sqlDb.prepare("INSERT INTO data ("+names.map(ident).join(",")+") VALUES ("+names.map(()=>"?").join(",")+")");try{data.forEach(r=>ins.run(names.map(c=>blank(r[c])?null:r[c])))}finally{ins.free()}const result=sqlDb.exec(query);let out=[];if(result.length){const r=result[result.length-1];out=r.values.map(vals=>Object.fromEntries(r.columns.map((c,i)=>[c,vals[i]])));host.innerHTML=genericTable(out);lastQueryRows=out;msg.innerHTML='<div class="result-message ok">Query completed · '+out.length+' result rows'+(out.length===1000? ' shown in the UI':'')+'.</div>'}else{host.innerHTML='<div class="empty">Statement completed. No tabular result was returned.</div>';lastQueryRows=[];msg.innerHTML='<div class="result-message ok">SQL statement completed.</div>'}}catch(e){msg.innerHTML='<div class="result-message error">'+esc(e.message||String(e))+'</div>';host.innerHTML='<div class="empty">Fix the query or check its column names, then run it again.</div>'}finally{btn.disabled=false}}
function bindEvents(){document.addEventListener("click",async e=>{const nav=e.target.closest("[data-view]");if(nav){e.preventDefault();go(nav.dataset.view);return}const sqlchip=e.target.closest("[data-sql]");if(sqlchip){$("#sqlEditor").value=sqlchip.dataset.sql;return}const colchip=e.target.closest("[data-insert-column]");if(colchip){const el=$("#formulaExpr");el.value=el.value+(el.value.trim()?" ":"")+"["+colchip.dataset.insertColumn+"]";el.focus();return}const th=e.target.closest("[data-sort]");if(th){const c=th.dataset.sort;sortDir=sortBy===c?-sortDir:1;sortBy=c;if(activeView==="dataset"){$("#dataTableHost").innerHTML=tableHTML(filtered())}else go("dataset");return}const act=e.target.closest("[data-action]")?.dataset.action;if(!act)return;try{switch(act){case"choose-file":$("#fileInput").click();break;case"confirm-import":await confirmImport();break;case"cancel-import":pendingImportFile=null;pendingImportBook=null;pendingImportRows=null;$("#headerEditor").hidden=true;$("#headerEditor").innerHTML="";$("#importProgress").hidden=true;toast("Import cancelled.");break;case"export-csv":exportCSV();break;case"export-json":exportJSON();break;case"reset-filter":filterState={column:"",query:""};sortBy=null;go("dataset");break;case"apply-filter":filterState={column:$("#filterColumn").value,query:$("#filterQuery").value};$("#dataTableHost").innerHTML=tableHTML(filtered());break;case"apply-missing":applyMissing();break;case"dedupe":dropDuplicates();break;case"trim-text":trimText();break;case"drop-column":dropColumn();break;case"build-chart":chartState={type:$("#chartType").value,x:$("#chartX").value,y:$("#chartY").value,agg:$("#chartAgg").value};$("#chartHost").innerHTML=renderChart();break;case"export-svg":{const svg=$("#chartHost")?.querySelector("svg");if(!svg)throw Error("Build a chart before exporting.");download("redata-chart.svg",new Blob([new XMLSerializer().serializeToString(svg)],{type:"image/svg+xml"}));break}case"run-pivot":runPivot();break;case"export-pivot":exportPivot();break;case"run-segments":runSegments();break;case"export-segments":exportSegments();break;case"run-hypothesis":$("#testHost").innerHTML=hypothesisRun();break;case"run-regression":$("#regHost").innerHTML=regressionResult($("#regX").value,$("#regY").value);break;case"apply-formula":{const name=$("#formulaName").value.trim(),expr=$("#formulaExpr").value.trim();if(!name||!expr)throw Error("Enter a new column name and expression.");if(cols().includes(name))throw Error("That column already exists. Choose a new name.");const calc=data.map(r=>formulaEval(expr,r));let changed=0;data=data.map((r,i)=>{const o={...r,[name]:calc[i]};if(calc[i]!==null)changed++;return o});$("#formulaHost").innerHTML='<div class="result-message ok">Created <b>'+esc(name)+'</b>. Computed numeric results for '+changed+' of '+data.length+' rows; invalid or missing inputs remain blank.</div>'+tableHTML(data.slice(0,10));break}case"run-sql":await runSQL();break;case"export-sql-result":if(!lastQueryRows)throw Error("Run a SQL query first.");exportCSV(lastQueryRows);break;case"export-stats":exportStats();break;case"export-report":exportReport();break;case"new-demo":data=sample.map(r=>({...r}));datasetName="demo_sales.csv";filterState={column:"",query:""};sortBy=null;go("overview");toast("Loaded the demonstration dataset.");break}}catch(err){toast(err.message||String(err))}});
$("#fileInput").addEventListener("change",e=>{const f=e.target.files[0];if(f){go("import");readFile(f)}e.target.value=""});
$("#menuBtn").addEventListener("click",()=>{$("#sidebar").classList.add("open");$("#mobileOverlay").classList.add("show")});$("#mobileOverlay").addEventListener("click",()=>{$("#sidebar").classList.remove("open");$("#mobileOverlay").classList.remove("show")});
}
function init(){bindEvents();render()}
init();
