<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fbf8f1" />
    <meta
      name="description"
      content="ReData — a browser-first data analysis workspace for cleaning, profiling, statistics, SQL, visualization and reporting."
    />
    <title>ReData — Analytics Workspace</title>
    <link rel="icon" href="assets/redata.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #24241f;
        --muted: #77766d;
        --paper: #fbf8f1;
        --card: #fffdf8;
        --line: #e9e3d8;
        --orange: #ed7b39;
        --shadow: 0 12px 34px rgba(62, 48, 27, 0.055);
        --sidebar: 252px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          14px "DM Sans",
          sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #ed7b3970;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none !important;
      }
      .sidebar {
        position: fixed;
        z-index: 20;
        inset: 0 auto 0 0;
        width: var(--sidebar);
        background: #fffdf9;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 22px 15px 16px;
        overflow: auto;
        transition: transform 0.25s;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 2px 10px 24px;
      }
      .brand-mark {
        width: 39px;
        height: 39px;
        border-radius: 13px;
        background: linear-gradient(145deg, #ffb06f, #ed7837);
        display: grid;
        place-items: center;
        box-shadow: 0 5px 14px #e9874240;
      }
      .brand-mark svg {
        width: 25px;
        height: 25px;
      }
      .brand-name {
        font:
          800 23px Manrope,
          sans-serif;
        letter-spacing: -1.2px;
      }
      .brand-name span {
        color: var(--orange);
      }
      .brand-caption {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: #9b9488;
        margin-top: 1px;
        font-weight: 700;
      }
      .sidebar-label {
        font-size: 10px;
        letter-spacing: 1.6px;
        color: #aaa294;
        font-weight: 800;
        padding: 13px 12px 8px;
      }
      .nav {
        display: grid;
        gap: 3px;
      }
      .nav-btn {
        border: 0;
        background: transparent;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 11px;
        color: #69695f;
        font-size: 13px;
        transition: 0.18s;
      }
      .nav-btn:hover {
        background: #f8f1e6;
        color: var(--ink);
      }
      .nav-btn.active {
        background: #fff0e3;
        color: #b9521b;
        font-weight: 700;
      }
      .nav-icon {
        width: 19px;
        height: 19px;
        display: grid;
        place-items: center;
        font-size: 16px;
        flex: 0 0 19px;
      }
      .nav-count {
        margin-left: auto;
        font:
          11px "DM Mono",
          monospace;
        color: #a29b8e;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: 17px 10px 0;
      }
      .privacy-card {
        background: #f4f0e7;
        border: 1px solid #eae2d3;
        border-radius: 14px;
        padding: 13px;
      }
      .privacy-card strong {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
      }
      .privacy-dot {
        width: 7px;
        height: 7px;
        background: #51a878;
        border-radius: 50%;
      }
      .privacy-card p {
        margin: 7px 0 0;
        color: #777368;
        font-size: 11px;
        line-height: 1.55;
      }
      .version {
        font-size: 10px;
        color: #b2aa9d;
        margin-top: 14px;
        padding-left: 3px;
        display: flex;
        justify-content: space-between;
      }
      .main {
        margin-left: var(--sidebar);
        min-height: 100vh;
      }
      .topbar {
        height: 67px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px;
        background: #fbf8f1e8;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(12px);
      }
      .crumb {
        font-size: 11px;
        letter-spacing: 1.2px;
        color: #969084;
        font-weight: 700;
      }
      .crumb b {
        color: #4b4941;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dataset-pill {
        max-width: 230px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        background: #fffdf9;
        border-radius: 10px;
        padding: 8px 11px;
        color: #68675e;
        font-size: 12px;
      }
      .dataset-pill span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dataset-pill .led {
        width: 7px;
        height: 7px;
        background: #5daf7c;
        border-radius: 50%;
        flex: 0 0 7px;
      }
      .icon-btn {
        height: 35px;
        width: 35px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #fffdf8;
        color: #67665c;
        display: grid;
        place-items: center;
      }
      .mobile-menu {
        display: none;
      }
      .content {
        max-width: 1550px;
        margin: 0 auto;
        padding: 30px 34px 58px;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 25px;
      }
      .eyebrow {
        color: var(--orange);
        font-size: 10px;
        letter-spacing: 1.9px;
        text-transform: uppercase;
        font-weight: 800;
        margin-bottom: 9px;
      }
      .page-title {
        font:
          800 clamp(27px, 3vw, 38px)/1.12 Manrope,
          sans-serif;
        letter-spacing: -1.6px;
        margin: 0;
      }
      .page-subtitle {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        margin: 9px 0 0;
        max-width: 680px;
      }
      .head-buttons {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid var(--line);
        background: #fffdf8;
        padding: 10px 14px;
        border-radius: 10px;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: #555449;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 14px #6f604018;
      }
      .btn.primary {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .btn.orange {
        background: var(--orange);
        border-color: var(--orange);
        color: #fff;
      }
      .btn.small {
        padding: 7px 10px;
        font-size: 11px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .kpi-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 17px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 17px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .kpi {
        padding: 19px 20px;
        position: relative;
        overflow: hidden;
      }
      .kpi:after {
        content: "";
        position: absolute;
        width: 74px;
        height: 74px;
        right: -26px;
        top: -27px;
        border-radius: 50%;
        background: var(--tint, #f7e7d7);
      }
      .kpi-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 1;
      }
      .kpi-label {
        font-size: 11px;
        color: #77766c;
        font-weight: 600;
      }
      .kpi-symbol {
        font-size: 17px;
      }
      .kpi-value {
        font:
          800 28px Manrope,
          sans-serif;
        letter-spacing: -1.3px;
        margin-top: 12px;
      }
      .kpi-foot {
        color: #908b7e;
        font-size: 10px;
        margin-top: 5px;
      }
      .dashboard-grid {
        grid-template-columns: minmax(0, 1.55fr) minmax(270px, 0.85fr);
        margin-bottom: 17px;
      }
      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 20px 21px 13px;
      }
      .panel-title {
        font:
          800 15px Manrope,
          sans-serif;
        letter-spacing: -0.3px;
        margin: 0;
      }
      .panel-sub {
        font-size: 11px;
        color: #8c877a;
        margin-top: 5px;
        line-height: 1.5;
      }
      .panel-body {
        padding: 0 21px 20px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        padding: 5px 8px;
        border-radius: 8px;
        color: #8b8577;
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
      }
      .chart-legend {
        display: flex;
        gap: 15px;
        align-items: center;
        margin-top: 8px;
        color: #827d71;
        font-size: 10px;
      }
      .legend-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 3px;
        margin-right: 5px;
      }
      .bar-chart {
        height: 184px;
        display: flex;
        align-items: flex-end;
        gap: 13px;
        padding: 18px 4px 0;
        border-bottom: 1px solid #e7e1d7;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 43px,
          #eee9e0 44px
        );
      }
      .bar-set {
        flex: 1;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 4px;
        position: relative;
        min-width: 0;
      }
      .bar {
        width: min(20px, 40%);
        border-radius: 5px 5px 0 0;
        background: #e5793e;
        min-height: 4px;
        transition: height 0.35s;
      }
      .bar-set span {
        position: absolute;
        bottom: -20px;
        font-size: 10px;
        color: #999184;
      }
      .chart-wrap {
        padding-bottom: 22px;
      }
      .flow-list {
        display: grid;
        gap: 13px;
      }
      .flow-item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .flow-icon {
        width: 35px;
        height: 35px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex: 0 0 35px;
        font-size: 16px;
      }
      .flow-copy {
        min-width: 0;
        flex: 1;
      }
      .flow-copy strong {
        display: block;
        font-size: 12px;
        margin: 2px 0 4px;
      }
      .flow-copy p {
        margin: 0;
        color: #858073;
        font-size: 11px;
        line-height: 1.5;
      }
      .flow-state {
        font-size: 10px;
        padding-top: 4px;
        color: #60a27b;
        font-weight: 700;
      }
      .quick-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .tool-card {
        padding: 17px 18px;
        text-align: left;
        border: 1px solid var(--line);
        background: #fffdf8;
        border-radius: 15px;
        transition: 0.18s;
        min-height: 132px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 9px;
      }
      .tool-card:hover {
        border-color: #e8ad82;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px #78502a0c;
      }
      .tool-icon {
        height: 34px;
        width: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-size: 17px;
      }
      .tool-card strong {
        font:
          800 13px Manrope,
          sans-serif;
      }
      .tool-card span {
        color: #8c8679;
        font-size: 11px;
        line-height: 1.5;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 27px 0 13px;
        gap: 12px;
      }
      .section-head h2 {
        font:
          800 16px Manrope,
          sans-serif;
        margin: 0;
        letter-spacing: -0.4px;
      }
      .section-head p {
        margin: 4px 0 0;
        color: #8f897d;
        font-size: 11px;
      }
      .workspace-panel {
        padding: 20px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: end;
        margin-bottom: 17px;
      }
      .field {
        display: grid;
        gap: 6px;
        min-width: 125px;
        flex: 1;
      }
      .field label {
        font-size: 10px;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 1px;
        color: #8a8376;
      }
      .field input,
      .field select,
      .field textarea,
      .sql-editor {
        width: 100%;
        min-width: 0;
        background: #fffefa;
        border: 1px solid #e5ded1;
        border-radius: 9px;
        padding: 10px 11px;
        color: #393830;
        font-size: 12px;
      }
      .field textarea {
        resize: vertical;
        min-height: 110px;
        font-family: "DM Mono", monospace;
      }
      .table-shell {
        overflow: auto;
        border: 1px solid #eee8dc;
        border-radius: 12px;
        background: #fffefa;
        max-width: 100%;
      }
      .data-table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 11px;
        white-space: nowrap;
      }
      .data-table th {
        background: #f7f3eb;
        text-align: left;
        position: sticky;
        top: 0;
        z-index: 1;
        font-size: 10px;
        color: #777265;
        letter-spacing: 0.4px;
        font-weight: 800;
        cursor: pointer;
      }
      .data-table th,
      .data-table td {
        padding: 11px 13px;
        border-bottom: 1px solid #eee9df;
      }
      .data-table td {
        color: #48473f;
        max-width: 250px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .data-table tbody tr:hover td {
        background: #fff7eb;
      }
      .data-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .empty {
        text-align: center;
        padding: 40px 20px;
        color: #8b8579;
      }
      .empty strong {
        display: block;
        color: #4e4b43;
        margin-bottom: 7px;
      }
      .hint {
        font-size: 11px;
        color: #8d877a;
        line-height: 1.55;
      }
      .notice {
        border: 1px solid #e9d8bd;
        background: #fff6e6;
        border-radius: 12px;
        padding: 12px 14px;
        color: #766444;
        font-size: 11px;
        line-height: 1.55;
        margin-bottom: 16px;
      }
      .notice.green {
        background: #edf8f0;
        border-color: #d2e8d9;
        color: #477756;
      }
      .notice.blue {
        background: #edf4fd;
        border-color: #d8e5f4;
        color: #526f8c;
      }
      .dropzone {
        border: 1.5px dashed #dfc7ac;
        background: #fff8ee;
        border-radius: 16px;
        padding: 34px 20px;
        text-align: center;
        transition: 0.2s;
      }
      .dropzone.drag {
        background: #ffebd9;
        border-color: var(--orange);
      }
      .drop-icon {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        background: #ffe2c9;
        margin: 0 auto 13px;
        font-size: 23px;
      }
      .dropzone h3 {
        margin: 0 0 6px;
        font:
          800 16px Manrope,
          sans-serif;
      }
      .dropzone p {
        margin: 0 auto 15px;
        color: #898173;
        font-size: 12px;
        line-height: 1.5;
      }
      .upload-types {
        font:
          10px "DM Mono",
          monospace;
        color: #a29a8d;
        margin-top: 13px;
      }
      .profile-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .profile-card {
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 15px;
        background: #fffdf9;
        min-width: 0;
      }
      .profile-name {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        font-weight: 800;
        font-size: 12px;
        margin-bottom: 10px;
        overflow-wrap: anywhere;
      }
      .type-chip {
        font:
          10px "DM Mono",
          monospace;
        color: #8d7966;
        background: #f4eee4;
        padding: 4px 6px;
        border-radius: 5px;
        font-weight: 400;
        white-space: nowrap;
      }
      .mini-stat {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #8a8478;
        font-size: 11px;
        padding: 7px 0;
        border-bottom: 1px solid #f0ebe2;
      }
      .mini-stat:last-child {
        border-bottom: 0;
      }
      .mini-stat b {
        color: #4b4941;
        font:
          500 11px "DM Mono",
          monospace;
      }
      .bar-track {
        height: 5px;
        background: #eee9df;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 8px;
      }
      .bar-track span {
        display: block;
        height: 100%;
        background: var(--orange);
        border-radius: 99px;
      }
      .two-col {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .result-box {
        border: 1px solid #e9e2d6;
        border-radius: 12px;
        background: #f8f5ee;
        padding: 14px;
        min-height: 70px;
      }
      .result-number {
        font:
          800 24px Manrope,
          sans-serif;
        letter-spacing: -1px;
      }
      .result-label {
        font-size: 11px;
        color: #898275;
        margin-top: 4px;
      }
      .sql-editor {
        min-height: 195px;
        font:
          12px/1.65 "DM Mono",
          monospace;
        resize: vertical;
        white-space: pre;
      }
      .sql-suggestions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 11px 0;
      }
      .code-chip {
        border: 1px solid var(--line);
        background: #fffdf8;
        border-radius: 7px;
        padding: 6px 9px;
        font:
          10px "DM Mono",
          monospace;
        color: #796e5f;
      }
      .result-message {
        padding: 10px 12px;
        border-radius: 8px;
        margin: 11px 0;
        font-size: 11px;
        line-height: 1.5;
      }
      .result-message.error {
        background: #fff0ec;
        color: #a4492c;
      }
      .result-message.ok {
        background: #edf7ee;
        color: #427c52;
      }
      .chart-stage {
        min-height: 280px;
        padding: 16px;
        background: #fffefa;
        border: 1px solid #eee7da;
        border-radius: 14px;
        overflow: auto;
      }
      .svg-chart {
        width: 100%;
        height: auto;
        display: block;
        min-width: 320px;
      }
      .metric-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-bottom: 15px;
      }
      .insight-list {
        padding-left: 18px;
        margin: 10px 0;
        color: #767164;
        font-size: 12px;
        line-height: 1.75;
      }
      .insight-list li {
        margin: 4px 0;
      }
      .footer-note {
        margin-top: 22px;
        text-align: center;
        font-size: 10px;
        color: #aaa294;
      }
      .toast {
        position: fixed;
        z-index: 100;
        right: 24px;
        bottom: 24px;
        background: #292923;
        color: #fffdf8;
        padding: 12px 16px;
        border-radius: 11px;
        box-shadow: 0 10px 30px #0002;
        font-size: 12px;
        max-width: min(420px, calc(100vw - 32px));
        animation: toastin 0.2s ease;
      }
      @keyframes toastin {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .mobile-overlay {
        display: none;
      }
      .learning-path {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 13px;
      }
      .learning-card {
        background: #fffdf9;
        border: 1px solid var(--line);
        border-radius: 14px;

            c = 1 + aa / c;
            if (Math.abs(c) < FPMIN) c = FPMIN;

        function formulaEval(expression, row) {
          const refs = [];
          let src = expression.replace(/\[([^\]]+)\]/g, (m, name) => {
            const i = cols().indexOf(name.trim());
            if (i < 0) throw Error("Unknown column reference: " + name);
            refs.push(i);
            return "@" + i;
          });
          const toks = [];
          const re =
            /\s*(?:(\d+(?:\.\d*)?|\.\d+)(?:([eE][+-]?\d+))?|(@\d+)|([()+\-*/%]))/gy;
          let pos = 0;
          while (pos < src.length) {
            re.lastIndex = pos;
            const m = re.exec(src);
            if (!m)
              throw Error("Invalid formula near: " + src.slice(pos, pos + 12));
            pos = re.lastIndex;
            if (m[1] !== undefined)
              toks.push({ t: "num", v: Number(m[1] + (m[2] || "")) });
            else if (m[3]) toks.push({ t: "ref", v: Number(m[3].slice(1)) });
            else toks.push({ t: m[4] });
          }
          let i = 0;
          function atom() {
            const t = toks[i++];
            if (!t) throw Error("Unexpected end of formula.");
            if (t.t === "num") return t.v;
            if (t.t === "ref") {
              const v = row[cols()[t.v]];
              if (!isNum(v)) return null;
              return Number(v);
            }
            if (t.t === "-" || t.t === "+") {
              const n = atom();
              return n === null ? null : t.t === "-" ? -n : n;
            }
            if (t.t === "(") {
              const v = expr();
              if (!toks[i] || toks[i++].t !== ")")
                throw Error("Missing closing parenthesis.");
              return v;
            }
            throw Error("Expected a number, column reference or parenthesis.");
          }
          function term() {
            let v = atom();
            while (toks[i] && ["*", "/", "%"].includes(toks[i].t)) {
              const op = toks[i++].t,
                n = atom();
              if (v === null || n === null) return null;
              if ((op === "/" || op === "%") && n === 0) return null;
              v = op === "*" ? v * n : op === "/" ? v / n : v % n;
            }
            return v;
          }
          function expr() {
            let v = term();
            while (toks[i] && ["+", "-"].includes(toks[i].t)) {
              const op = toks[i++].t,
                n = term();
              if (v === null || n === null) return null;
              v = op === "+" ? v + n : v - n;
            }
            return v;
          }
          const value = expr();
          if (i !== toks.length) throw Error("Unexpected token in formula.");
          return Number.isFinite(value) ? value : null;
        }

                  exportReport();
                  break;
                case "new-demo":
                  engineActive = false;
                  E = { meta: null, v: {} };
                  data = sample.map((r) => ({ ...r }));
                  datasetName = "demo_sales.csv";
                  filterState = { column: "", query: "" };
                  sortBy = null;
                  go("overview");
                  toast("Loaded the demonstration dataset.");
                  break;
              }
            } catch (err) {
              toast(err.message || String(err));
            }
          });
          document.addEventListener("change", (e) => {
            if (e.target && e.target.id === "testGroup")
              refreshGroupOptions().catch((err) => toast(err.message));
          });
          $("#fileInput").addEventListener("change", (e) => {
            const f = e.target.files[0];
            if (f) {
              go("import");
              readFile(f);
            }
            e.target.value = "";
          });
          $("#menuBtn").addEventListener("click", () => {
            $("#sidebar").classList.add("open");
            $("#mobileOverlay").classList.add("show");
          });
          $("#mobileOverlay").addEventListener("click", () => {
            $("#sidebar").classList.remove("open");
            $("#mobileOverlay").classList.remove("show");
          });
        }
        async function init() {
          bindEvents();
          if (ENGINE) {
            $("#fileInput").accept += ",.parquet";
            try {
              const st = await api("/api/status");
              if (st.dataset) {
                const meta = await withBusy("Opening " + st.dataset + " in the local engine…", () =>
                  api("/api/meta"),
                );
                activateEngine(meta.meta);
                toast("Restored " + st.dataset + " from the local engine.");
              }
            } catch (err) {
              toast(err.message || String(err));
            }
          }
          go(activeView);
        }
        init();
      })();
    </script>
  </body>
</html>
