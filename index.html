function cols(){return data.length?Object.keys(data[0]):[]}function blank(v){return v===null||v===undefined||String(v).trim()===""}function isNum(v){return typeof v==="number"&&Number.isFinite(v)||typeof v==="string"&&v.trim()!==""&&Number.isFinite(Number(v))}function nums(c){return data.map(r=>r[c]).filter(v=>!blank(v)&&isNum(v)).map(Number)}function numCols(){return cols().filter(c=>{const a=data.map(r=>r[c]).filter(v=>!blank(v));return a.length&&a.filter(isNum).length/a.length>=.8})}function catCols(){return cols().filter(c=>!numCols().includes(c))}function fmt(n){return n===null||n===undefined||!Number.isFinite(Number(n))?"—":Number(n).toLocaleString(undefined,{maximumFractionDigits:2})}function mean(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}function sum(a){return a.reduce((s,x)=>s+x,0)}function missingCount(){return data.reduce((n,r)=>n+cols().filter(c=>blank(r[c])).length,0)}function duplicateCount(){const seen=new Set();let n=0;data.forEach(r=>{const k=JSON.stringify(cols().map(c=>r[c]));if(seen.has(k))n++;else seen.add(k)});return n}function toastMaybe(s){toast(s)}

function renderChart(){const type=chartState.type||"bar",x=chartState.x||(catCols()[0]||cols()[0]),y=chartState.y||(numCols()[0]||cols()[0]),agg=chartState.agg||"sum";if(!x||!y)return '<div class="empty">Load fields to create a chart.</div>';let points=[];if(type==="scatter"){points=data.map(r=>({x:Number(r[x]),y:Number(r[y])})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).slice(0,250)}else if(agg==="none"&&["bar","line"].includes(type)){points=data.filter(r=>!blank(r[x])&&isNum(r[y])).slice(0,40).map(r=>({label:String(r[x]),value:Number(r[y])}))}else{const mp=new Map();data.forEach(r=>{if(blank(r[x]))return;const k=String(r[x]),v=Number(r[y]);if(!mp.has(k))mp.set(k,{sum:0,n:0});let a=mp.get(k);if(agg==="count"){a.n++}else if(isNum(v)){a.sum+=v;a.n++}});points=[...mp.entries()].map(([label,a])=>({label,value:agg==="count"?a.n:agg==="avg"?(a.n?a.sum/a.n:0):a.sum})).sort((a,b)=>type==="line"?0:b.value-a.value).slice(0,18)}if(!points.length)return '<div class="empty">There are no usable values for this combination.</div>';const W=680,H=330,L=58,R=18,T=20,B=54,iw=W-L-R,ih=H-T-B,labels=points.map(p=>p.label),max=Math.max(...(type==="scatter"?points.map(p=>p.y):points.map(p=>p.value)),1),min=type==="scatter"?Math.min(...points.map(p=>p.y),0):0;let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" class="svg-chart" role="img" aria-label="'+esc(type+" chart of "+y+" by "+x)+'"><rect width="'+W+'" height="'+H+'" rx="8" fill="#fffefa"/>';for(let i=0;i<=4;i++){let yy=T+ih*i/4;svg+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#eee8dc"/><text x="'+(L-9)+'" y="'+(yy+4)+'" font-size="10" text-anchor="end" fill="#958b7a">'+esc(fmt(max*(1-i/4)))+'</text>'}if(type==="scatter"){const xmax=Math.max(...points.map(p=>p.x),1),xmin=Math.min(...points.map(p=>p.x),0);svg+=points.map(p=>'<circle cx="'+(L+(p.x-xmin)/(xmax-xmin||1)*iw)+'" cy="'+(T+ih-(p.y-min)/(max-min||1)*ih)+'" r="4" fill="#e5793e" opacity=".8"><title>'+esc("x="+p.x+", y="+p.y)+'</title></circle>').join("")}else if(type==="pie"||type==="doughnut"){let total=points.reduce((a,p)=>a+p.value,0)||1,angle=-Math.PI/2,cx=W/2,cy=T+ih/2,rad=Math.min(iw,ih)*.38;const palette=["#e5793e","#e8b787","#8db88b","#91b4dc","#b6a5d9","#e7d079","#70c4bd","#c2cbbc","#dd9a91","#a6c5ae"];points.forEach((p,i)=>{const a=p.value/total*Math.PI*2,b=angle+a,xy=t=>[cx+rad*Math.cos(t),cy+rad*Math.sin(t)],p1=xy(angle),p2=xy(b),large=a>Math.PI?1:0;svg+='<path d="M '+cx+' '+cy+' L '+p1.join(" ")+' A '+rad+' '+rad+' 0 '+large+' 1 '+p2.join(" ")+' Z" fill="'+palette[i%palette.length]+'"><title>'+esc(p.label+": "+fmt(p.value))+'</title></path>';angle=b});if(type==="doughnut")svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(rad*.52)+'" fill="#fffefa"/><text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" font-size="12" fill="#71685b">TOTAL</text>'}else{const bw=iw/points.length*(type==="line"?.12:.64);if(type==="line")svg+='<polyline points="'+points.map((p,i)=>(L+(i+.5)*iw/points.length)+','+(T+ih-p.value/max*ih)).join(" ")+'" fill="none" stroke="#de793f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';points.forEach((p,i)=>{const xx=L+(i+.5)*iw/points.length,yy=T+ih-p.value/max*ih;if(type==="line")svg+='<circle cx="'+xx+'" cy="'+yy+'" r="4" fill="#de793f"/>';else svg+='<rect x="'+(xx-bw/2)+'" y="'+yy+'" width="'+bw+'" height="'+Math.max(0,T+ih-yy)+'" rx="4" fill="#e5793e"><title>'+esc(p.label+": "+fmt(p.value))+'</title></rect>';svg+='<text x="'+xx+'" y="'+(H-28)+'" font-size="10" text-anchor="middle" fill="#8a8070">'+esc(String(p.label).slice(0,10))+'</text>'})}svg+='</svg><p class="hint" style="margin:10px 0 0">Chart type: '+esc(type)+' · '+points.length+' plotted items · X: '+esc(x)+' · Y: '+esc(y)+'</p>';return svg}
function statisticsRows(){return numCols().map(c=>{const a=nums(c);return {column:c,valid:a.length,missing:data.length-a.length,sum:sum(a),mean:mean(a),median:median(a),min:a.length?Math.min(...a):null,max:a.length?Math.max(...a):null,sd:sd(a)}})}function sd(a){if(a.length<2)return null;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1))}
function statisticsTemplate(){return '<div class="page-head"><div><div class="eyebrow">06 / DESCRIPTIVE ANALYSIS</div><h1 class="page-title">Understand the distribution.</h1><p class="page-subtitle">'+esc(desc.statistics)+'</p></div><button class="btn" data-action="export-stats">↓ Export summary</button></div><div class="notice blue">These are descriptive statistics, not causal estimates. Outliers, measurement units, sampling design and missingness patterns can materially change interpretation.</div><div class="panel workspace-panel"><div class="section-head" style="margin-top:0"><div><h2>Numeric profile</h2><p>For fields detected as numeric; values are computed on non-missing rows.</p></div></div>'+genericTable(statisticsRows())+'</div><div class="section-head"><div><h2>Distribution clues</h2><p>Questions to ask before choosing a model or a summary metric.</p></div></div><div class="grid learning-path"><article class="learning-card"><h3>Central tendency</h3><p>Compare mean and median. A large gap can signal skew or extreme observations.</p></article><article class="learning-card"><h3>Spread & outliers</h3><p>Inspect quartiles, range, standard deviation, valid units and source-system limits.</p></article><article class="learning-card"><h3>Categories & missingness</h3><p>Check uncommon values, category drift, empty strings, missing-not-at-random risks.</p></article></div>'}
function welch(a,b){if(a.length<2||b.length<2)return {error:"Each group needs at least two numeric observations."};const ma=mean(a),mb=mean(b),va=sd(a)**2,vb=sd(b)**2,se=Math.sqrt(va/a.length+vb/b.length),t=(ma-mb)/se,df=(va/a.length+vb/b.length)**2/((va/a.length)**2/(a.length-1)+(vb/b.length)**2/(b.length-1));return {ma,mb,diff:ma-mb,se,t,df,n1:a.length,n2:b.length}}

function hypothesisRun(){const g=$("#testGroup").value,m=$("#testMeasure").value,a=$("#testA").value,b=$("#testB").value;if(!g||!m||a===b)return "Choose two distinct groups and a numeric measure.";const x=data.filter(r=>String(r[g])===a&&isNum(r[m])).map(r=>Number(r[m])),y=data.filter(r=>String(r[g])===b&&isNum(r[m])).map(r=>Number(r[m])),r=welch(x,y);if(r.error)return r.error;return '<div class="grid metric-grid">'+kpi("GROUP A MEAN",fmt(r.ma),"n = "+r.n1,"A","#f5dfcd")+kpi("GROUP B MEAN",fmt(r.mb),"n = "+r.n2,"B","#e0eafa")+kpi("A − B",fmt(r.diff),"difference in means","Δ","#e0f0df")+'</div><p>Welch t statistic: <b>'+fmt(r.t)+'</b> · approximate degrees of freedom: <b>'+fmt(r.df)+'</b> · standard error of difference: <b>'+fmt(r.se)+'</b></p><p class="hint">No p-value is provided by this lightweight tool. Validate with a trusted statistics environment before reporting inferential conclusions.</p>'}

function regressionResult(x,y){if(!x||!y||x===y)return "Choose two distinct numeric fields.";const pairs=data.filter(r=>isNum(r[x])&&isNum(r[y])).map(r=>[Number(r[x]),Number(r[y])]);if(pairs.length<3)return "At least three complete numeric pairs are required.";const mx=mean(pairs.map(p=>p[0])),my=mean(pairs.map(p=>p[1])),sxx=sum(pairs.map(p=>(p[0]-mx)**2)),syy=sum(pairs.map(p=>(p[1]-my)**2)),sxy=sum(pairs.map(p=>(p[0]-mx)*(p[1]-my))),slope=sxx?sxy/sxx:null,intercept=slope===null?null:my-slope*mx,r=sxx&&syy?sxy/Math.sqrt(sxx*syy):null;return '<div class="grid metric-grid">'+kpi("PEARSON r",fmt(r),"linear association","ρ","#e0eafa")+kpi("SLOPE",fmt(slope),"change in Y per X unit","↗","#e0f0df")+kpi("R²",fmt(r===null?null:r*r),"explained variance in simple fit","R","#f5dfcd")+'</div><p>Fitted line: <code>'+esc(y)+' = '+fmt(intercept)+' + '+fmt(slope)+' × '+esc(x)+'</code> using '+pairs.length+' complete pairs.</p>'}

"){row.push(v.replace(/$/,""));rs.push(row);row=[];v=""}else v+=c}if(v.length||row.length){row.push(v.replace(/$/,""));rs.push(row)}const valid=rs.filter(r=>r.some(c=>String(c).trim()!==""));if(!valid.length)return [];const header=valid.shift().map((h,i)=>String(h).trim()||"column_"+(i+1));return valid.map(r=>Object.fromEntries(header.map((h,i)=>{const x=r[i]===undefined?"":r[i].trim();return [h,x===""?null:/^-?(?:d+.?d*|.d+)(?:e[+-]?d+)?$/i.test(x)?Number(x):x]})))}
function normalizeRows(rs){if(!Array.isArray(rs))throw Error("Expected a JSON array of records.");if(!rs.length)return [];if(rs.every(r=>r&&typeof r==="object"&&!Array.isArray(r))){const keys=[...new Set(rs.flatMap(r=>Object.keys(r)))];return rs.map(r=>Object.fromEntries(keys.map(k=>[k,r[k]===undefined||r[k]===""?null:r[k]])))}if(rs.every(Array.isArray)){const [head,...body]=rs;return body.map(r=>Object.fromEntries(head.map((h,i)=>[String(h||("column_"+(i+1))),r[i]===undefined?null:r[i]])))}throw Error("JSON must contain an array of record objects or arrays.")}
function coerceRows(rs){if(!rs.length)throw Error("No data rows were found.");if(rs.length>250000)throw Error("This browser-first preview is limited to 250,000 rows. Sample or aggregate larger files first.");return rs.map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[String(k),v===undefined||v===""?null:v])))}
function loadRows(rs,name){data=coerceRows(normalizeRows(rs));datasetName=name;filterState={column:"",query:""};sortBy=null;lastQueryRows=null;chartState={type:"bar",x:catCols()[0]||"",y:numCols()[0]||"",agg:"sum"};if(sqlDb){sqlDb.close();sqlDb=null}go("dataset");toast("Loaded "+data.length.toLocaleString()+" rows from "+name)}
async function readFile(file){try{const ext=file.name.split(".").pop().toLowerCase();if(["xlsx","xls"].includes(ext)){if(!window.XLSX){toast("Loading Excel reader…");await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js")}const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}),sheet=wb.Sheets[wb.SheetNames[0]];loadRows(XLSX.utils.sheet_to_json(sheet,{defval:null,raw:true}),file.name);return}const text=await file.text();let rs;if(ext==="json"){let obj=JSON.parse(text);if(!Array.isArray(obj)&&obj&&typeof obj==="object"){const candidate=Object.values(obj).find(Array.isArray);if(candidate)obj=candidate}rs=normalizeRows(obj)}else if(ext==="ndjson"||ext==="jsonl"){rs=text.split(/?

/,5).join("

function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement("script");s.src=src;s.onload=resolve;s.onerror=()=>reject(Error("Could not load required library from CDN."));document.head.appendChild(s)})}
function applyMissing(){const strategy=$("#fillStrategy").value;if(strategy==="leave"){toast("No changes made.");return}if(strategy==="drop"){const n=data.length;data=data.filter(r=>cols().every(c=>!blank(r[c])));toast("Dropped "+(n-data.length)+" rows with missing values.");go("clean");return}const marker=$("#fillMarker").value||"Unknown";let changed=0;data=data.map(r=>{const o={...r};cols().forEach(c=>{if(blank(o[c])){if(strategy==="marker"){o[c]=marker;changed++}else if(strategy==="zero"&&numCols().includes(c)){o[c]=0;changed++}else if(strategy==="mean"&&numCols().includes(c)){o[c]=mean(nums(c));changed++}else if(strategy==="median"&&numCols().includes(c)){o[c]=median(nums(c));changed++}}});return o});toast("Filled "+changed+" missing cells. Review the result.");go("clean")}
function dropDuplicates(){const n=data.length,seen=new Set();data=data.filter(r=>{const k=JSON.stringify(cols().map(c=>r[c]));if(seen.has(k))return false;seen.add(k);return true});toast("Removed "+(n-data.length)+" exact duplicate rows.");go("clean")}
function trimText(){let n=0;data=data.map(r=>{const o={...r};cols().forEach(c=>{if(typeof o[c]==="string"){const v=o[c].replace(/s+/g," ").trim();if(v!==o[c])n++;o[c]=v===""?null:v}});return o});toast("Normalized "+n+" text cells.");go("clean")}
function dropColumn(){const c=$("#dropColumn").value;if(!c)return;if(!confirm("Remove column '"+c+"' from the working dataset? This does not change the original file."))return;data=data.map(r=>{const o={...r};delete o[c];return o});sortBy=null;filterState={column:"",query:""};toast("Removed column "+c);go("clean")}
function populateTestGroups(){const g=$("#testGroup");if(!g)return;const values=[...new Set(data.map(r=>String(r[g.value??catCols()[0]]??"")))].slice(0,100);setTestOptions(values)}
function setTestOptions(values){["testA","testB"].forEach((id,i)=>{const el=$("#"+id);if(el)el.innerHTML=values.map((v,j)=>'<option '+(j===i?'selected':'')+'>'+esc(v)+'</option>').join("")})}
function runPivot(){const g=$("#pivotGroup").value,y=$("#pivotMeasure").value,ag=$("#pivotAgg").value;lastPivotRows=pivotRows(g,y,ag);$("#pivotHost").innerHTML=genericTable(lastPivotRows)}
function pivotRows(g,m,agg){const mp=new Map();data.forEach(r=>{const k=blank(r[g])?"(Missing)":String(r[g]);if(!mp.has(k))mp.set(k,[]);if(m==="(count rows)")mp.get(k).push(1);else if(isNum(r[m]))mp.get(k).push(Number(r[m]))});return [...mp].map(([group,a])=>({[g]:group,measure:m,aggregation:agg,value:!a.length?null:agg==="count"?a.length:agg==="avg"?mean(a):agg==="min"?Math.min(...a):agg==="max"?Math.max(...a):sum(a),rows:a.length})).sort((a,b)=>(b.value??-Infinity)-(a.value??-Infinity))}
function runSegments(){const g=$("#segmentField").value;lastSegments=segmentRows(g);$("#segmentsHost").innerHTML=segmentView()}
function segmentRows(g){const mp=new Map();data.forEach(r=>{const k=blank(r[g])?"(Missing)":String(r[g]);if(!mp.has(k))mp.set(k,{segment:k,rows:0,missing:0});const x=mp.get(k);x.rows++;x.missing+=cols().filter(c=>blank(r[c])).length});return [...mp.values()].sort((a,b)=>b.rows-a.rows).map(x=>({...x,share:x.rows/data.length,avgMissing:x.missing/Math.max(1,x.rows)}))}
function segmentView(){return '<div class="grid profile-grid">'+lastSegments.map(s=>'<article class="profile-card"><div class="profile-name">'+esc(s.segment)+'</div><div class="mini-stat"><span>Rows</span><b>'+s.rows+'</b></div><div class="bar-track"><span style="width:'+(s.share*100)+'%"></span></div><div class="mini-stat"><span>Share of dataset</span><b>'+(s.share*100).toFixed(1)+'%</b></div><div class="mini-stat"><span>Avg missing cells/row</span><b>'+fmt(s.avgMissing)+'</b></div></article>').join("")+'</div>'}
function formulaEval(expression,row){const src=expression.replace(/[([^]]+)]/g,(m,n)=>{const c=n.trim();if(!cols().includes(c))throw Error("Unknown column: "+c);return JSON.stringify(row[c])});if(!/^[ds.+-*/%()]+$/.test(src))throw Error("Formula may contain only numbers, arithmetic operators, parentheses and numeric column references.");const tokens=src.match(/d+(?:.d*)?(?:e[+-]?d+)?|.d+|[()+-*/%]/gi)||[];const safe=src.replace(/s/g,"");if(tokens.join("")!==safe)throw Error("Invalid arithmetic expression.");const result=(new Function("return ("+src+")"))();return Number.isFinite(result)?result:null}
function formulaTemplate(){return '<div class="page-head"><div><div class="eyebrow">11 / DERIVED FIELDS</div><h1 class="page-title">Make a new measure.</h1><p class="page-subtitle">'+esc(desc.formulas)+'</p></div></div><div class="notice">Use numbers, + − * / %, parentheses, and column references such as [revenue] / [units]. Invalid or missing calculations become blank.</div><div class="panel workspace-panel"><div class="grid two-col"><div class="field"><label>New column name</label><input id="formulaName" placeholder="revenue_per_unit"></div><div class="field"><label>Numeric expression</label><input id="formulaExpr" placeholder="[revenue] / [units]"></div></div><div class="section-head"><div><h2>Available columns</h2><p>Click a field to insert its reference.</p></div></div><div class="sql-suggestions">'+cols().map(c=>'<button class="code-chip" data-insert-column="'+esc(c)+'">['+esc(c)+']</button>').join("")+'</div><button class="btn orange" data-action="apply-formula">Create derived column</button><div id="formulaHost" style="margin-top:16px"></div></div>'}
function sd(a){if(a.length<2)return null;const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1))}
function welch(a,b){if(a.length<2||b.length<2)return {error:"Each group needs at least two numeric observations."};const ma=mean(a),mb=mean(b),va=sd(a)**2,vb=sd(b)**2,se=Math.sqrt(va/a.length+vb/b.length),t=se?(ma-mb)/se:0,df=(va/a.length+vb/b.length)**2/((va/a.length)**2/(a.length-1)+(vb/b.length)**2/(b.length-1));return {ma,mb,diff:ma-mb,se,t,df,n1:a.length,n2:b.length}}
function hypothesisRun(){const g=$("#testGroup").value,m=$("#testMeasure").value,a=$("#testA").value,b=$("#testB").value;if(!g||!m||a===b)return "Choose two distinct groups and a numeric measure.";const x=data.filter(r=>String(r[g]??"")===a&&isNum(r[m])).map(r=>Number(r[m])),y=data.filter(r=>String(r[g]??"")===b&&isNum(r[m])).map(r=>Number(r[m])),r=welch(x,y);if(r.error)return r.error;return '<div class="grid metric-grid">'+kpi("GROUP A MEAN",fmt(r.ma),"n = "+r.n1,"A","#f5dfcd")+kpi("GROUP B MEAN",fmt(r.mb),"n = "+r.n2,"B","#e0eafa")+kpi("A − B",fmt(r.diff),"difference in means","Δ","#e0f0df")+'</div><p>Welch t statistic: <b>'+fmt(r.t)+'</b> · approximate degrees of freedom: <b>'+fmt(r.df)+'</b> · standard error: <b>'+fmt(r.se)+'</b></p><p class="hint">No p-value is provided. Validate with a trusted statistical environment before reporting inference.</p>'}
function regressionResult(x,y){if(!x||!y||x===y)return "Choose two distinct numeric fields.";const p=data.filter(r=>isNum(r[x])&&isNum(r[y])).map(r=>[Number(r[x]),Number(r[y])]);if(p.length<3)return "At least three complete numeric pairs are required.";const mx=mean(p.map(z=>z[0])),my=mean(p.map(z=>z[1])),xx=sum(p.map(z=>(z[0]-mx)**2)),yy=sum(p.map(z=>(z[1]-my)**2)),xy=sum(p.map(z=>(z[0]-mx)*(z[1]-my))),slope=xx?xy/xx:null,intercept=slope===null?null:my-slope*mx,r=xx&&yy?xy/Math.sqrt(xx*yy):null;return '<div class="grid metric-grid">'+kpi("PEARSON r",fmt(r),"linear association","ρ","#e0eafa")+kpi("SLOPE",fmt(slope),"change in Y per X unit","↗","#e0f0df")+kpi("R²",fmt(r===null?null:r*r),"simple linear fit","R","#f5dfcd")+'</div><p>Fitted line: <code>'+esc(y)+' = '+fmt(intercept)+' + '+fmt(slope)+' × '+esc(x)+'</code> using '+p.length+' complete pairs.</p>'}
function exportReport(){const b=summary(),q=$("#reportQuestion")?.value||"",f=$("#reportFinding")?.value||"",c=$("#reportCaveat")?.value||"",text="# ReData Analysis Brief\n\n## Dataset\n- File: "+datasetName+"\n- Rows: "+data.length+"\n- Columns: "+cols().length+"\n- Missing cells: "+missingCount()+"\n- Exact duplicate rows: "+duplicateCount()+"\n\n## Quick summary\n"+(b.measure&&b.dimension?"Largest aggregate group by "+b.measure+" across "+b.dimension+": "+b.labels[0]+" ("+fmt(b.values[0])+").":"No suitable numeric/category pair is available for quick aggregation.")+"\n\n## Business question\n"+(q||"Add your business question.")+"\n\n## Key finding and evidence\n"+(f||"Add a specific finding supported by a metric or comparison.")+"\n\n## Caveats and next step\n"+(c||"Document limitations, uncertainty, definitions and next validation steps.")+"\n\nAutomated summaries are not independent validation.\n";download("redata-analysis-brief.md",new Blob([text],{type:"text/markdown;charset=utf-8"}));toast("Analysis brief downloaded.")}
async function runSQL(){const btn=$("#runSqlBtn"),msg=$("#sqlMessage"),host=$("#sqlHost"),query=$("#sqlEditor").value.trim();btn.disabled=true;msg.innerHTML='<div class="result-message ok">Preparing the in-memory SQLite database…</div>';try{if(!window.initSqlJs)throw Error("SQL.js has not loaded. Check the network and reload.");const SQL=await window.initSqlJs({locateFile:f=>"https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/"+f});if(sqlDb)sqlDb.close();sqlDb=new SQL.Database();const names=cols(),ident=c=>'"'+c.replace(/"/g,'""')+'"',schema=names.map(c=>ident(c)+" TEXT").join(",");sqlDb.run("CREATE TABLE data ("+schema+")");const ins=sqlDb.prepare("INSERT INTO data ("+names.map(ident).join(",")+") VALUES ("+names.map(()=>" ?").join(",").replace(/ /g,"")+")");try{data.forEach(r=>ins.run(names.map(c=>blank(r[c])?null:String(r[c]))))}finally{ins.free()}const result=sqlDb.exec(query);if(result.length){const r=result[result.length-1];lastQueryRows=r.values.map(vals=>Object.fromEntries(r.columns.map((c,i)=>[c,vals[i]])));host.innerHTML=genericTable(lastQueryRows);msg.innerHTML='<div class="result-message ok">Query completed · '+lastQueryRows.length+' result row(s).</div>'}else{host.innerHTML='<div class="empty">Statement completed; no table result returned.</div>';lastQueryRows=[];msg.innerHTML='<div class="result-message ok">SQL statement completed.</div>'}}catch(e){msg.innerHTML='<div class="result-message error">'+esc(e.message||String(e))+'</div>';host.innerHTML='<div class="empty">Fix the query or review its column names.</div>'}finally{btn.disabled=false}}

function bindEvents(){document.addEventListener("click",async e=>{const n=e.target.closest("[data-view]");if(n){e.preventDefault();go(n.dataset.view);return}const chip=e.target.closest("[data-sql]");if(chip){$("#sqlEditor").value=chip.dataset.sql;return}const col=e.target.closest("[data-insert-column]");if(col){$("#formulaExpr").value+=$("#formulaExpr").value.trim()?" ["+col.dataset.insertColumn+"]":"["+col.dataset.insertColumn+"]";return}const th=e.target.closest("[data-sort]");if(th){sortDir=sortBy===th.dataset.sort?-sortDir:1;sortBy=th.dataset.sort;$("#dataTableHost").innerHTML=tableHTML(filtered());return}const act=e.target.closest("[data-action]")?.dataset.action;if(!act)return;try{switch(act){case"choose-file":$("#fileInput").click();break;case"export-csv":exportCSV();break;case"export-json":exportJSON();break;case"reset-filter":filterState={column:"",query:""};sortBy=null;go("dataset");break;case"apply-filter":filterState={column:$("#filterColumn").value,query:$("#filterQuery").value};$("#dataTableHost").innerHTML=tableHTML(filtered());break;case"apply-missing":applyMissing();break;case"dedupe":dropDuplicates();break;case"trim-text":trimText();break;case"drop-column":dropColumn();break;case"build-chart":chartState={type:$("#chartType").value,x:$("#chartX").value,y:$("#chartY").value,agg:$("#chartAgg").value};$("#chartHost").innerHTML=renderChart();break;case"export-svg":{const svg=$("#chartHost")?.querySelector("svg");if(!svg)throw Error("Build a chart first.");download("redata-chart.svg",new Blob([new XMLSerializer().serializeToString(svg)],{type:"image/svg+xml"}));break}case"run-pivot":runPivot();break;case"export-pivot":exportCSV(lastPivotRows.length?lastPivotRows:[{note:"Run the aggregate first"}]);break;case"run-segments":runSegments();break;case"export-segments":exportCSV(lastSegments.length?lastSegments:[{note:"Run segment breakdown first"}]);break;case"run-hypothesis":$("#testHost").innerHTML=hypothesisRun();break;case"run-regression":$("#regHost").innerHTML=regressionResult($("#regX").value,$("#regY").value);break;case"apply-formula":{const name=$("#formulaName").value.trim(),expr=$("#formulaExpr").value.trim();if(!name||!expr)throw Error("Enter a name and expression.");if(cols().includes(name))throw Error("Choose a new column name.");const calc=data.map(r=>{try{return formulaEval(expr,r)}catch{return null}});let changed=0;data=data.map((r,i)=>{const v=calc[i];if(v!==null)changed++;return {...r,[name]:v}});$("#formulaHost").innerHTML='<div class="result-message ok">Created <b>'+esc(name)+'</b>; '+changed+' numeric results. Invalid/missing inputs remain blank.</div>'+tableHTML(data.slice(0,10));break}case"run-sql":await runSQL();break;case"export-sql-result":if(!lastQueryRows)throw Error("Run SQL first.");exportCSV(lastQueryRows);break;case"export-stats":exportCSV(statisticsRows());break;case"export-report":exportReport();break;case"new-demo":data=sample.map(r=>({...r,revenue:r.order_id==="RD-1011"?null:r.revenue}));datasetName="demo_sales.csv";filterState={column:"",query:""};sortBy=null;if(sqlDb){sqlDb.close();sqlDb=null}go("overview");toast("Loaded the fictional demonstration dataset.");break}}catch(err){toast(err.message||String(err))}});
