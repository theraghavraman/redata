[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redata-engine"
dynamic = ["version"]
description = "Sync databases, files and APIs into DuckDB staging tables: full, append and upsert syncs with saved cursor state and schema-drift handling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raghav Raman" }]
keywords = ["etl", "elt", "ingestion", "duckdb", "incremental-sync", "data-engineering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]
# The core install syncs SQLite, files, URLs and REST APIs. Database and
# warehouse drivers are extras, so a small install stays small.
dependencies = [
  "duckdb>=1.1.0",
  "pyarrow>=14.0",
  "pytz>=2023.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "openpyxl>=3.1.0",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
sqlserver = ["pymssql>=2.3"]
snowflake = ["snowflake-connector-python>=3.12"]
s3 = ["boto3>=1.34"]
all = [
  "psycopg[binary]>=3.1",
  "PyMySQL>=1.1",
  "pymssql>=2.3",
  "snowflake-connector-python>=3.12",
  "boto3>=1.34",
]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
redata = "redata.cli:main"

[project.urls]
Homepage = "https://github.com/theraghavraman/redata"

[tool.setuptools]
package-dir = { "" = "engine" }
packages = ["redata"]

[tool.setuptools.dynamic]
version = { attr = "redata.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
