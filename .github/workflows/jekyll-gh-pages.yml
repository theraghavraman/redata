# Deploy ReData as a plain static HTML application (no Jekyll transform).
name: Deploy ReData to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate static app entry points
        shell: bash
        run: |
          test -s index.html
          test -s assets/redata.svg
          test -s engine/redata_engine.py
          test -s engine/requirements.txt
          python - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert "<!doctype html>" in html.lower(), "index.html is missing its HTML doctype"
          assert 'id="workspaceContent"' in html, "workspace mount point is missing"
          assert "function overviewTemplate()" in html, "Overview renderer is missing"
          assert "function importTemplate()" in html, "Import view renderer is missing"
          assert "function init()" in html, "application initializer is missing"
          assert html.rstrip().lower().endswith("</html>"), "index.html is not closed"
          print("Static app entry-point checks passed.")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
