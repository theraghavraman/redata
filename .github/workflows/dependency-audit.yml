name: ReData dependency and license audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  push:
    paths:
      - "engine/requirements.txt"
      - "index.html"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/dependency-audit.yml"
      - ".github/workflows/browser-dependency-audit.yml"
      - "scripts/reconcile_dependency_audit.py"
      - "scripts/audit_browser_dependencies.py"
      - "scripts/check_inline_js_syntax.py"
      - "docs/DEPENDENCY_AUDIT.md"
  pull_request:
    paths:
      - "engine/requirements.txt"
      - "index.html"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/dependency-audit.yml"
      - ".github/workflows/browser-dependency-audit.yml"
      - "scripts/reconcile_dependency_audit.py"
      - "scripts/audit_browser_dependencies.py"
      - "scripts/check_inline_js_syntax.py"
      - "docs/DEPENDENCY_AUDIT.md"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "engine/requirements.txt"
      - name: Install declared engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt
          python -m pip install pip-audit pip-licenses cyclonedx-bom
      - name: Generate resolved license inventory
        run: pip-licenses --format=json --output-file=licenses-resolved.json
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Reconcile SBOM and license inventory
        run: python scripts/reconcile_dependency_audit.py
      - name: Audit known Python package vulnerabilities
        run: pip-audit
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redata-dependency-audit-${{ github.sha }}
          path: |
            licenses-resolved.json
            sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90
