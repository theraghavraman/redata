name: ReData reproducible smoke benchmark

on:
  push:
    paths:
      - "benchmarks/**"
      - "engine/**"
      - "tests/**"
      - ".github/workflows/benchmark-generator-tests.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "engine/**"
      - "tests/**"
      - ".github/workflows/benchmark-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile generator and tests
        run: python -m py_compile benchmarks/generate_dataset.py tests/test_generate_dataset.py benchmarks/run_engine_smoke.py
      - name: Run generator regression tests
        run: python -m unittest discover -s tests -p "test_generate_dataset.py" -v

  engine-smoke-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install local-engine dependency
        run: python -m pip install --disable-pip-version-check "duckdb>=1.1.0"
      - name: Run real local-engine smoke benchmark (1 million rows)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python benchmarks/run_engine_smoke.py --rows 1000000 --columns 10 --repeats 5 --output benchmark-results/engine-smoke.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redata-engine-smoke-${{ github.sha }}
          path: benchmark-results/engine-smoke.json
          if-no-files-found: warn
