name: ReData reproducible benchmark

on:
  push:
    paths:
      - "benchmarks/**"
      - "engine/**"
      - "tests/**"
      - ".github/workflows/benchmark-generator-tests.yml"
  pull_request:
    paths:
      - "benchmarks/**"
      - "engine/**"
      - "tests/**"
      - ".github/workflows/benchmark-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile generator and tests
        run: python -m py_compile benchmarks/generate_dataset.py tests/test_generate_dataset.py benchmarks/run_engine_smoke.py
      - name: Run generator regression tests
        run: python -m unittest discover -s tests -p "test_generate_dataset.py" -v

  engine-correctness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install local-engine dependency
        run: python -m pip install --disable-pip-version-check "duckdb>=1.1.0"
      - name: Compile engine correctness tests
        run: python -m py_compile engine/redata_engine.py tests/test_engine_correctness.py
      - name: Run local-engine correctness fixtures
        run: python -m unittest discover -s tests -p "test_engine_correctness.py" -v

  engine-smoke-benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install local-engine dependency
        run: python -m pip install --disable-pip-version-check "duckdb>=1.1.0"
      - name: Run large local-engine benchmark (10 million rows, 10 columns)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python benchmarks/run_engine_smoke.py --rows 10000000 --columns 10 --import-repeats 1 --repeats 5 --output benchmark-results/engine-smoke.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redata-engine-smoke-${{ github.sha }}
          path: benchmark-results/engine-smoke.json
          if-no-files-found: warn

  engine-ci-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install local-engine dependency
        run: python -m pip install --disable-pip-version-check "duckdb>=1.1.0"
      - name: Run routine 1M local-engine smoke benchmark with repeated imports
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python benchmarks/run_engine_smoke.py --rows 1000000 --columns 10 --import-repeats 3 --repeats 5 --output benchmark-results/engine-ci-smoke.json
      - name: Upload routine smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redata-engine-ci-smoke-${{ github.sha }}
          path: benchmark-results/engine-ci-smoke.json
          if-no-files-found: warn
